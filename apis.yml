aid: onlinenic
name: OnlineNIC
description: >-
  OnlineNIC, Inc. is an ICANN-accredited domain registrar (IANA ID 82) and wholesale reseller platform,
  operating since 1999, that sells domain names across roughly 400 TLDs, SSL/TLS certificates from
  DigiCert, GeoTrust, RapidSSL, Sectigo and Symantec, business email, reseller and cloud hosting, escrow
  and domain-privacy services. It publishes a partner-facing Reseller API — currently build 4.0.9 — that
  lets resellers register, renew, transfer and manage domains, manage contacts, nameservers and EPP auth
  codes, apply ID Shield registrant privacy, run Whois verification, and order, reissue, cancel and revoke
  SSL certificates. The API is an RPC surface over HTTPS with a JSON envelope; the contract is published
  only as a PDF reference guide, with no OpenAPI or other machine-readable description.
