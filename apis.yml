apis:
  - aid: onlinenic:onlinenic
    name: OnlineNIC Reseller API
    description: >-
      The OnlineNIC Reseller API (build 4.0.9) gives partners programmatic control of the OnlineNIC
      product catalogue. Twenty-six domain commands cover availability checking, registration, renewal,
      information, status and DNS updates, contact objects, registrar transfer in and out, EPP auth
      codes, private nameservers, Whois verification and ID Shield registrant privacy. Seventeen SSL
      commands cover CSR parsing, approver-email discovery, ordering, renewal, price and product lookup,
      order query and listing, domain-control validation, reissue, cancellation with refund, certificate
      retrieval and revocation. The surface is RPC over HTTPS — two PHP endpoints with a `command` query
      parameter, POST only — and every response is HTTP 200 carrying a JSON envelope with an integer
      status code. Authentication is an API key plus a per-request MD5 token over the reseller id,
      password digest, timestamp and command name, with an optional source-IP allowlist. The reference
      is published as a PDF; there is no OpenAPI, AsyncAPI, GraphQL SDL or Postman collection.
    humanURL: https://www.onlinenic.com/cp_english/template_api/api_help.php
    baseURL: https://api.onlinenic.com/api4/
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/onlinenic.png
    tags:
