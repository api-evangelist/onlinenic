  pattern: 4.0x
  current_version: 4.0.9.2
  current_version_source: >-
    Title page of the current guide ("Build 4.0.9"); the file is published as
    Onlinenic_API_v4.0.9.2_Reseller_Guide.pdf.
  machine_readable: false
  feed: null
