entries:
  - version: '4.09'
    date: null
    date_note: >-
      Undated in the change log; the provider's API page gives the 4.09 release date as 2020-03-17, and
      the matching News Center announcement is dated March 17 2020.
    breaking: false
    additions:
      - Change Domain Validation Method (changeDCVmethod)
    highlights: New feature — change the DCV method of an SSL order after submission.
  - version: '4.08'
    date: '2020-02-06'
    breaking: false
    additions:
      - 'getSSLOrderList response gains page (page number) and pagesum (total pages)'
      - 'getSSLOrderInfo response gains completedate'
    changes:
      - Removed the "Note, File, DNS are available only with domain-validated products" restriction from Order SSL and Renewal.
      - Order SSL accepts multiple emails for Sectigo SANs.
      - SANs must not include the subject domain carried in the CSR.
      - 'Placing/renewing a Sectigo SSL with DNS or File DCV now returns md5, sha256 and uniquevalue.'
    highlights: Pagination arrives on the order list; Sectigo DCV validation values are returned.
  - version: '4.07'
    date: null
    breaking: false
    changes:
      - 'CheckWhois improved — now returns send_date and the email address.'
  - version: '4.06'
    date: null
    breaking: false
    additions:
      - Domain Whois Verification (checkWhoisVF)
      - Resend Whois Verification mail (resendWhoisVF)
    changes:
      - ID Shield interface update
  - version: '4.05'
    date: null
    breaking: false
    additions:
      - File-based and DNS-based SSL validation methods on the ordering request
