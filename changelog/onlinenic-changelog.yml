x-finding:
  latest_documented_change: '2020-08-04'
  note: >-
    Both dated surfaces stop in 2020. The API itself is live and answering today — probed 2026-09-17 —
    but nothing OnlineNIC publishes records a change to it in more than six years. For an integrator
    that is the material fact: there is no way to learn from the vendor whether the contract has moved.
