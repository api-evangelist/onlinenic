description: >-
  OnlineNIC keeps two dated surfaces that together act as an API changelog: a "Change Log" addendum
  inside the API Reseller Guide PDF, which lists what each 4.0x build added, and the News Center, which
  announces product and API changes to partners with a date on each item. Neither is a feed — there is
  no RSS, no Atom and no JSON — and both stop in 2020.
