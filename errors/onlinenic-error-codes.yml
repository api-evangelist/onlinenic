specification: API Commons Error Catalog
specificationVersion: '0.1'
provider: OnlineNIC
providerId: onlinenic
generated: '2026-09-17'
method: searched
source: https://www.onlinenic.com/cp_english/template_api/download/Onlinenic_API_v4.0.9.2_Reseller_Guide.pdf#6.1
docs: https://www.onlinenic.com/cp_english/template_api/api_help.php
description: 'Complete error-code registry for the OnlineNIC Reseller API v4, transcribed verbatim from Addendum
  6.1 "Response Parameters" of the provider-published API 4.0.9 Reseller Guide. This is the non-payments sibling
  of a decline-code catalogue: OnlineNIC is a domain registrar and SSL reseller, so the registry mixes request/auth
  faults with registry-side domain, contact, host, transfer and ID Shield failures. Codes are flat integers carried
  in the response envelope, NOT HTTP status codes — every documented response is HTTP 200 with the outcome in the
  body.'
format: proprietary-envelope
rfc9457: false
envelope:
  content_type: application/json
  fields:
  - name: code
    type: integer
    description: Status code from this registry; 1000 means success.
  - name: msg
    type: string
    description: Human-readable message. The guide calls the field "message" in the parameter tables and returns
      it as "msg" on the wire.
  - name: data
    type: object
    description: Command-specific payload, present only on success for commands that return data.
  note: 'Observed live: GET https://api.onlinenic.com/api4/ssl/index.php returns HTTP 200 with {"code":1001,"msg":"Invalid
    request."} and an unauthenticated POST returns HTTP 200 with {"code":1004,"msg":"Required parameter missing(user)."}.
    The transport status code carries no error information, so a client MUST parse the body.'
success_code: 1000
error_count: 78
code_count: 79
ranges:
- range: 1000-1011
  meaning: Protocol, request-shape and authentication faults
- range: 1012-1033
  meaning: SSL ordering, order-state and billing faults
- range: 1034-1068
  meaning: Domain, contact, host and transfer faults (registry-side)
- range: 1069-1075
  meaning: ID Shield privacy service and Whois verification
- range: 2000-2002
  meaning: Registrant change approval workflow (asynchronous, pending state)
