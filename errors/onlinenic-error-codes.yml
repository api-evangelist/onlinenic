gaps:
- No HTTP status differentiation — every documented outcome is HTTP 200.
- No RFC 9457 application/problem+json representation.
- No stable machine-readable error type URIs; the integer code is the only identifier.
- Messages interpolate {$parameter} and {$msg} at runtime, so exact strings vary.
