  https://www.onlinenic.com/cp_english/template_api/download/Onlinenic_API_v4.0.9.2_Reseller_Guide.pdf
status: candidate
description: >-
  OnlineNIC ships no MCP server. This is a CANDIDATE tool list derived from the 43 commands the
  provider documents in its own API 4.0.9 Reseller Guide — a sketch of what an MCP server over this
  API would expose, not a server anyone can call. No MCPServer pointer is wired into apis.yml; the
  pointer would assert that OnlineNIC operates an agent surface, and it does not.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: >-
    Searched for a hosted or local server on 2026-09-17 — no /mcp or /sse endpoint on any OnlineNIC
    host, no MCP mention in the API guide or on the site, no npm/PyPI package under an OnlineNIC
    namespace, and no GitHub organisation. mode:none records a derived candidate. `auth: api-key`
    describes what any such server would have to carry (apikey + MD5 token), not something verified.
