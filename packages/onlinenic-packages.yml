description: >-
  Client libraries and integration packages for the OnlineNIC Reseller API. OnlineNIC distributes its
  own code as ZIP downloads from its website — there is no npm, PyPI, Packagist, Maven or NuGet entry
  under an OnlineNIC namespace, and no GitHub organisation (api.github.com/orgs/onlinenic returns 404).
  Every registry named in the enrichment contract was checked. Currency is the headline finding here:
  the newest first-party artifact of any kind is the 2019 WHMCS module, and the only SDK OnlineNIC
  ships targets API 3.4 — the version its own documentation page labels "Deprecated" — while the
  current API is 4.0.9.
