first_party_count: 3
third_party_count: 1
currency_finding: >-
  Every first-party package predates the current API. The SDK (2015) targets the deprecated 3.4 socket
  protocol; the WHMCS module (2019) drives the same socket protocol; the API it is meant to wrap moved
  to HTTPS/JSON and reached build 4.0.9 in March 2020. A reseller adopting OnlineNIC today either
  integrates the current API with no first-party client at all, or uses a first-party client against a
  protocol the vendor's own documentation marks deprecated.
