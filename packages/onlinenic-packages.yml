    note: >-
      Community library, NOT published by OnlineNIC. Its author states it exists because OnlineNIC
      shipped no library for API v4. It is the only package anywhere that covers the current REST API,
      and it has been unmaintained since December 2020. Recorded for completeness and explicitly marked
