packages:
  - name: OnlineNIC PHP SDK (sdk_php)
    language: PHP
    official: true
    registry: direct-download
    url: https://www.onlinenic.com/cp_english/template_api/download.php?f=sdk_php.zip
    docs: https://www.onlinenic.com/cp_english/template_api/api_help.php
    version: '3.4'
    published: '2015-10-08'
    version_note: >-
      The download URL is unpinned — it always serves the current build and carries no version in the
      path — so a consumer cannot tell what they are getting from the link alone. The version and date
      recorded here are the ones the provider prints beside the download on its API page ("Software
      Development Kit for API 3.4 ... Release Date: 2015.10.08").
    targets_api_version: '3.4'
    status: stale
    note: >-
      Downloaded and inspected 2026-09-17 (HTTP 200, 35,164 bytes, 39 files). It implements the
      DEPRECATED v3.4 socket API, not the current REST API v4: ApiClient.php builds an XML
      <request><category><action><params><cltrid><chksum> document and ships it over a raw TCP socket,
      and config.php defaults to server 218.5.81.149 port 30009 with the shared OTE account. It carries
      39 demo scripts covering domain, SSL and account operations. No first-party SDK exists for API v4.
    probed:
      url: https://www.onlinenic.com/cp_english/template_api/download.php?f=sdk_php.zip
      status: 200
      bytes: 35164
      content_type: application/zip
  - name: OnlineNIC Pro (WHMCS registrar module)
    language: PHP
    kind: platform-module
    platform: WHMCS
    official: true
    registry: direct-download
    url: https://www.onlinenic.com/en/public/upload/down/20181015/1539576471.zip
    docs: https://www.onlinenic.com/en/Module/index/17.html
    version: '1.46'
    published: '2019-05-10'
    version_note: Version and release date printed on the provider's WHMCS module page.
    supports:
      - WHMCS 6.x
      - WHMCS 7.x
      - PHP 5.4+
    transport_note: >-
      Requires outbound TCP to the OnlineNIC API server on port 30009, i.e. it drives the deprecated
      socket API rather than the HTTPS v4 API. The page publishes the iptables rules to open it.
    features:
      - Domain registration / renewal / transfer, including new gTLDs
      - Transfer lock, contact update, nameserver change, private DNS
      - EPP auth code retrieval
      - ID Shield privacy protection
      - Domain auto-synchronisation
    note: >-
      Last released 2019-05-10 and declares support only through WHMCS 7.x; WHMCS has shipped 8.x since
      2020. Probed 2026-09-17 — the ZIP still downloads (HTTP 200, 550,498 bytes).
    probed:
      url: https://www.onlinenic.com/en/public/upload/down/20181015/1539576471.zip
      status: 200
      bytes: 550498
      content_type: application/zip
