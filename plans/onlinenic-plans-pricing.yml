description: >-
  OnlineNIC's published plan structure. NOTE ON PROVENANCE: this file previously carried a
  Free/Professional/Enterprise scaffold with invented quotas and TBD prices, written by a 2026-05-04
  bulk sweep and never harvested from the provider. That scaffold was wrong in kind, not just in
  detail — OnlineNIC does not sell API access in tiers at all. It was replaced on 2026-09-17 with
  what the provider actually publishes on its own pricing page.
plan_model: prepayment-tier
api_pricing:
  model: free-with-account
  note: >-
    API access is not a priced product. The reseller pages state "No setup fees, no annual fees, sign
    up now to get API access" and "FREE Use of Reseller API/template System". What a reseller pays for
    is the underlying domain, certificate and hosting inventory; the tier they sit in determines the
    wholesale price of that inventory, not their API entitlement. There is no request quota, no API
    metering and no overage.
  source: https://www.onlinenic.com/en/Module/index/17.html
plan_count: 4
plans:
  - id: onlinenic-platinum
    name: Platinum
    type: prepayment-tier
    price: '1129.00'
    currency: USD
    billing_period: one-time prepayment
    description: >-
      Highest reseller tier. "Again, all prepayment can be spent" — the prepayment is account credit,
      not a fee. Buys the lowest wholesale prices across the TLD and certificate catalogue.
