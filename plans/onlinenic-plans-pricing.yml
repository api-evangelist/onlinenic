minimum_prepayment:
  amount: '98.90'
  currency: USD
  source: >-
    Error code 1030 in the API reference — "Please add at least $98.9 prepayment to your account." The
    API refuses to transact below this balance, which makes it a hard runtime constraint on an agent,
    not just a commercial term.
billing_errors:
  - code: 1023
    meaning: Billing error — check account balance.
  - code: 1030
    meaning: Minimum prepayment not met.
catalogue:
  url: https://www.onlinenic.com/en/Domains/index/19.html
  status: 200
  tld_rows: 394
  note: >-
    The pricing page publishes a per-TLD wholesale price for each of the four tiers across gTLDs, new
    gTLDs and ccTLDs, with separate registration and renewal figures. Prices are read from the rendered
    table; a few TLDs also have a promotional first-year price shown alongside the standard price.
  machine_readable: false
  machine_readable_note: >-
    There is no pricing API or downloadable price feed on the public site. The API's own getSSLprice
    and getSSLProductDetails commands return certificate prices to an authenticated reseller, and the
    WHMCS Pricing Importer consumes "the official CSV file" — but that CSV is behind the reseller
    control panel, so no machine-readable price list is publicly reachable.
